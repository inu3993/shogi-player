<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>将棋 動かせる盤</title>
    <style>
      :root{
        --page-bg:#efe0bd;
        --page-bg2:#e7d3a4;
        --ink:#2b1d0e;
        --ink-soft:#5a4632;
        --panel:#f7ecd2;
        --panel-line:#c9ab72;
        --board-bg:#ecca8b;
        --board-line:#7a5c2e;
        --cell-line:#a37f42;
        --piece-face:#f8e7b8;
        --piece-face2:#eed49a;
        --piece-edge:#6e5326;
        --piece-ink:#241806;
        --promo:#b02318;
        --accent:#8a5a1d;
        --accent-ink:#fff8ea;
        --tab-bg:#e2cd9c;
        --tab-active:#8a5a1d;
        --btn-bg:#fdf6e0;
        --btn-line:#8a6a35;
        --shadow:0 2px 10px rgba(90,60,10,.18);
      }
      * { box-sizing: border-box; }
      html,body{ margin:0; padding:0; }
      body{
        font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
        background:linear-gradient(180deg,var(--page-bg),var(--page-bg2));
        color:var(--ink);
        min-height:100vh;
      }
      main{ max-width:640px; margin:0 auto; padding:16px 14px 40px; }
      .tabs{ display:flex; gap:8px; margin:6px 0 10px; }
      .tab{
        flex:1 1 0; min-height:48px; padding:10px 8px;
        font-size:15px; font-weight:700; line-height:1.35;
        color:var(--ink); background:var(--tab-bg);
        border:1.5px solid var(--panel-line); border-radius:10px;
        cursor:pointer; font-family:inherit;
      }
      .tab small{ display:block; font-size:11.5px; font-weight:400; color:var(--ink-soft); }
      .tab[aria-selected="true"]{ background:var(--tab-active); color:var(--accent-ink); border-color:var(--tab-active); }
      .tab[aria-selected="true"] small{ color:#f3dfae; }
      .howto{ font-size:13.5px; color:var(--ink-soft); margin:2px 2px 14px; }
      .panel{
        background:var(--panel); border:1.5px solid var(--panel-line);
        border-radius:14px; padding:18px 16px 20px; box-shadow:var(--shadow);
      }
      h2{ font-size:21px; margin:0 0 8px; letter-spacing:.02em; }
      .players{ font-size:14.5px; line-height:1.6; margin:0 0 10px; font-weight:600; }
      .highlight{ font-size:14.5px; line-height:1.75; margin:0 0 16px; color:var(--ink); }
      /* ---- board ---- */
      .board-frame{ max-width:520px; margin:0 auto; }
      .board{
        display:grid; grid-template-columns:repeat(9,1fr) 1.4em;
        background:var(--board-bg);
        border:2.5px solid var(--board-line);
        padding:6px 6px 6px 8px;
        box-shadow:inset 0 0 0 1px rgba(122,92,46,.35), 0 1px 6px rgba(90,60,10,.25);
      }
      .coord{ display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--ink-soft); font-weight:600; }
      .coord.file{ height:1.5em; }
      .coord.rank{ padding-left:2px; }
      .cell{
        aspect-ratio:1/1.08; border:.5px solid var(--cell-line);
        display:flex; align-items:center; justify-content:center;
        position:relative;
      }
      .piece{
        width:88%; height:92%;
        clip-path:polygon(50% 0%, 96% 21%, 86% 100%, 14% 100%, 4% 21%);
        background:var(--piece-edge);
        display:flex; align-items:center; justify-content:center;
      }
      .piece-in{
        width:calc(100% - 3px); height:calc(100% - 3px);
        clip-path:polygon(50% 0%, 96% 21%, 86% 100%, 14% 100%, 4% 21%);
        background:linear-gradient(180deg,var(--piece-face),var(--piece-face2));
        display:flex; align-items:center; justify-content:center;
      }
      .piece span{
        font-family:"Hiragino Mincho ProN","Hiragino Mincho Pro","Yu Mincho",YuMincho,"Kozuka Mincho Pro",serif;
        font-weight:700; color:var(--piece-ink);
        font-size:clamp(13px,4.4vw,23px); line-height:1;
        transform:translateY(8%);
      }
      .piece.two span{ font-size:clamp(9px,3vw,15px); letter-spacing:-.05em; }
      .piece.promo span{ color:var(--promo); }
      .piece.gote{ transform:rotate(180deg); }
      /* ---- hands & controls ---- */
      .hands{ max-width:520px; margin:12px auto 0; font-size:15px; line-height:1.7; }
      .hands .who{ font-weight:700; }
      .nav{
        max-width:520px; margin:14px auto 0;
        display:flex; align-items:center; gap:10px;
      }
      .nav button{
        flex:0 0 auto; min-height:48px; padding:10px 18px;
        font-size:16px; font-weight:700; font-family:inherit;
        color:var(--ink); background:var(--btn-bg);
        border:1.5px solid var(--btn-line); border-radius:10px; cursor:pointer;
      }
      .nav button:disabled{ opacity:.35; cursor:default; }
      .nav button:active:not(:disabled){ background:var(--tab-bg); }
      #info{ flex:1 1 auto; text-align:center; font-size:15px; font-weight:700; white-space:nowrap; }
      .jumps{ max-width:520px; margin:14px auto 0; }
      .jumps .jlabel{ font-size:13px; font-weight:700; color:var(--ink-soft); margin:0 0 6px; }
      .jumps .jrow{ display:flex; flex-wrap:wrap; gap:8px; }
      .jump{
        min-height:44px; padding:8px 14px;
        font-size:14px; font-weight:700; font-family:inherit;
        color:var(--ink); background:var(--btn-bg);
        border:1.5px solid var(--btn-line); border-radius:10px; cursor:pointer;
      }
      .jump[aria-pressed="true"]{ background:var(--tab-active); color:var(--accent-ink); border-color:var(--tab-active); }
      .slider-row{ max-width:520px; margin:10px auto 0; display:flex; align-items:center; gap:10px; }
      .slider-row .edge{ font-size:12px; color:var(--ink-soft); white-space:nowrap; }
      input[type=range]{ flex:1 1 auto; height:40px; accent-color:var(--accent); cursor:pointer; }
      @media (max-width:560px){
        .nav{ flex-wrap:wrap; }
        #info{ order:-1; flex:1 1 100%; margin-bottom:2px; }
        .nav button{ flex:1 1 0; }
      }
      .note{
        max-width:520px; margin:18px auto 0; padding:14px 16px;
        background:var(--btn-bg); border:1.5px solid var(--panel-line); border-radius:10px;
      }
      .note h3{ font-size:16px; margin:0 0 6px; }
      .note p{ font-size:14.5px; line-height:1.8; margin:0; }
      .article-link{ margin:18px 0 0; font-size:14px; }
      .article-link a{ color:var(--accent); font-weight:700; display:inline-block; padding:8px 0; }
      footer{ max-width:640px; margin:18px auto 0; padding:0 16px; }
      footer p{ font-size:12px; color:var(--ink-soft); line-height:1.6; margin:0; }
      @media (prefers-color-scheme: dark){
        :root{
          --page-bg:#251a0c; --page-bg2:#191106;
          --ink:#f4e7c8; --ink-soft:#c8ab7d;
          --panel:#31220f; --panel-line:#6d5327;
          --tab-bg:#3a2a12; --btn-bg:#3a2a12; --btn-line:#a37f42;
          --shadow:0 2px 10px rgba(0,0,0,.5);
        }
        .tab[aria-selected="true"] small{ color:#f3dfae; }
      }
    </style>
  </head>

        <button class="tab" role="tab" id="tab-junisen85-ito-masuda" data-game="junisen85-ito-masuda" aria-selected="false">第85期順位戦A級 5回戦<small>伊藤匠叡王 対 増田康宏八段</small></button>
        <button class="tab" role="tab" id="tab-junisen85-b1-watanabe-oishi" data-game="junisen85-b1-watanabe-oishi" aria-selected="false">第85期順位戦B級1組 9回戦<small>大石直嗣七段 対 渡辺明九段</small></button>

      <p class="howto">ボタンやスライダーで手を進めたり戻したりできます。「見たい局面」のボタンで、封じ手や決め手、終局図へ直接移動できます。</p>

      <section class="panel" aria-live="polite">
        <h2 id="g-title"></h2>
        <p class="players" id="g-players"></p>
        <p class="highlight" id="g-highlight"></p>

        <div class="board-frame">
          <div class="board" id="board" aria-label="将棋盤"></div>

        <div class="hands">

          <div><span class="who">☖後手の持駒：</span><span id="hand-gote"></span></div>

        <div class="nav">
          <button id="prev" type="button">← 前へ</button>
          <span id="info"></span>
          <button id="next" type="button">次へ →</button>
        </div>
        <div class="jumps">
          <p class="jlabel">見たい局面</p>
          <div class="jrow" id="jumps"></div>
        </div>

        <div class="slider-row">
          <span class="edge">0手目</span>
          <input type="range" id="slider" min="0" step="1" value="0" aria-label="手数を選ぶ" />
          <span class="edge" id="slider-max"></span>
        </div>

        <section class="note" id="g-note" hidden>
          <h3 id="g-note-title"></h3>
          <p id="g-note-text"></p>
        </section>

        <p class="article-link"><a id="g-article" href="#" target="_blank" rel="noopener">この対局の記事を読む →</a></p>
      </section>

      <footer>
        <p>棋譜は日本将棋連盟・各棋戦の中継および棋譜速報の公開情報に基づく。</p>
      </footer>
    </main>

      var KANJI = {"P":"歩","L":"香","N":"桂","S":"銀","G":"金","B":"角","R":"飛","K":"玉","+P":"と","+L":"成香","+N":"成桂","+S":"成銀","+B":"馬","+R":"龍"};

      function parseSfen(sfen){
        var parts = sfen.split(" ");
        var rows = parts[0].split("/");
        var cells = [];
        for (var r = 0; r < rows.length; r++){
          var row = rows[r];
          for (var i = 0; i < row.length; i++){
            var ch = row[i];
            if (ch >= "0" && ch <= "9"){
              var n = parseInt(ch, 10);
              for (var j = 0; j < n; j++) cells.push(null);
            } else if (ch === "+"){
              var p = row[i+1];
              cells.push({ sym: "+" + p.toUpperCase(), gote: p === p.toLowerCase(), promo: true });
              i++;
            } else {
              cells.push({ sym: ch.toUpperCase(), gote: ch === ch.toLowerCase(), promo: false });
            }
          }
        }
        return { cells: cells, turn: parts[1], hand: parts[2] || "-" };
      }

      function handText(hand, sente){
        if (!hand || hand === "-") return "なし";
        var counts = {};
        var re = /(\d*)([A-Za-z])/g, m;
        while ((m = re.exec(hand)) !== null){
          var sym = m[2];
          var isSente = sym === sym.toUpperCase();
          if (isSente === sente){
            var key = sym.toUpperCase();
            counts[key] = (counts[key] || 0) + (m[1] ? parseInt(m[1], 10) : 1);
          }
        }
        var out = [];
        for (var i = 0; i < HAND_ORDER.length; i++){
          var k = HAND_ORDER[i];
          if (counts[k]) out.push(KANJI[k] + (counts[k] > 1 ? counts[k] : ""));
        }
        return out.length ? out.join(" ") : "なし";
      }

      function render(){
        var game = GAMES[current];
        var idx = state[current];
        var parsed = parseSfen(game.sfens[idx]);
        var html = "";
        var f, r, c;
        for (f = 0; f < 9; f++) html += '<div class="coord file">' + FILES[f] + "</div>";
        html += '<div class="coord file"></div>';
        for (r = 0; r < 9; r++){
          for (c = 0; c < 9; c++){
            var cell = parsed.cells[r * 9 + c];
            if (cell){
              var label = KANJI[cell.sym];
              html += '<div class="cell"><div class="piece' + (cell.gote ? " gote" : "") + (cell.promo ? " promo" : "") + (label.length > 1 ? " two" : "") + '"><div class="piece-in"><span>' + label + "</span></div></div></div>";
            } else {

          }
          html += '<div class="coord rank">' + RANKS[r] + "</div>";

      function rawHashString(){
        var h = "";
        try { h = location.hash || ""; } catch (e) {}
        if (!h || h === "#"){
          try { if (window.parent && window.parent !== window) h = window.parent.location.hash || h; } catch (e) {}
        }
        if (!h || h === "#"){

        }
        return h || "";
      }

        raw = raw.replace(/^\//, "").replace(/\s+$/, "");
        if (!raw) return null;
        var at = raw.indexOf("@");
        if (at >= 0){
          return { id: raw.slice(0, at), ply: parseInt(raw.slice(at + 1), 10), hasPly: true };
        }
        return { id: raw, ply: null, hasPly: false };
      }
      function parseQuery(){
        var s = "";
        try { s = location.search || ""; } catch (e) {}

        var plyRaw = (typeof params.ply !== "undefined") ? params.ply : params.p;
        if (typeof plyRaw !== "undefined" && plyRaw !== ""){

        }
        return { id: id, ply: null, hasPly: false };

                userMoved = true;
                state[current] = clampPly(GAMES[current], jump.ply);
                render();
              });
              jumpsEl.appendChild(b);
            })(game.jumps[k]);
          }
        }
        var tabs = document.querySelectorAll(".tab");
        for (var i = 0; i < tabs.length; i++){
          tabs[i].setAttribute("aria-selected", tabs[i].getAttribute("data-game") === id ? "true" : "false");
        }
        if (pushHash && location.hash !== "#" + id){
          history.replaceState(null, "", "#" + id);
        }
        render();
      }

      var tabBtns = document.querySelectorAll(".tab");
      for (var i = 0; i < tabBtns.length; i++){
        tabBtns[i].addEventListener("click", function(){ userMoved = true; selectGame(this.getAttribute("data-game"), true); });
      }
      prevBtn.addEventListener("click", function(){ if (state[current] > 0){ userMoved = true; state[current]--; render(); } });
      nextBtn.addEventListener("click", function(){ if (state[current] < GAMES[current].sfens.length - 1){ userMoved = true; state[current]++; render(); } });
      slider.addEventListener("input", function(){ userMoved = true; state[current] = parseInt(slider.value, 10); render(); });
      document.addEventListener("keydown", function(e){
        if (e.key === "ArrowLeft") prevBtn.click();
        if (e.key === "ArrowRight") nextBtn.click();
      });
      window.addEventListener("hashchange", function(){ applyDeepLink(true); });
      window.addEventListener("load", function(){ if (!userMoved) applyDeepLink(false); });

      (function(){
        if (!applyDeepLink(false)) selectGame("ryuou39-3", false);
      })();
    </script>
  </body>
</html>
